
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>मेरी पहली वेबसाइट</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #111827;
      color: white;
      padding: 30px;
    }

    .card {
      background: #1f2937;
      padding: 25px;
      border-radius: 15px;
      margin-top: 50px;
    }

    button {
      background: #22c55e;
      color: white;
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>मेरी पहली वेबसाइट</h1>

    <p>नमस्ते! यह मेरी खुद की वेबसाइट है।</p>

    <button onclick="alert('आपकी वेबसाइट काम कर रही है!')">
      क्लिक करें
    </button>
  </div>

</body>
</html>
